name: zero_chart
description: 120Hz Element-Bypass financial & real-time telemetry charting engine for Flutter. Includes LTTB downsampling, OHLCV Candlestick, OrderBook L2 Depth chart, Technical Indicators (SMA, EMA, RSI, Bollinger), and Multi-Pane synchronized Crosshair. Zero external dependencies.
version: 1.0.0
homepage: https://redlightapps.com
repository: https://github.com/RedlightApps/zero_chart
issue_tracker: https://github.com/RedlightApps/zero_chart/issues
documentation: https://github.com/RedlightApps/zero_chart#readme

funding:
  - https://www.buymeacoffee.com/yusufkaval
  - https://github.com/sponsors/kvlyusuf
  - https://github.com/sponsors/RedlightApps

topics:
  - chart
  - candlestick
  - finance
  - trading
  - visualization

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
